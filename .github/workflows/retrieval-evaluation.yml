name: Project quality checks

on:
  push:
    branches:
      - main
      - improvement/provenance-and-quality-review
      - integration/clean-rag-review
    paths:
      - "evaluation/**"
      - "tests/**"
      - "tests.py"
      - "auth.py"
      - "server.py"
      - "app.html"
      - "config.py"
      - "ingest.py"
      - "pipeline.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/retrieval-evaluation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "evaluation/**"
      - "tests/**"
      - "tests.py"
      - "auth.py"
      - "server.py"
      - "app.html"
      - "config.py"
      - "ingest.py"
      - "pipeline.py"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/retrieval-evaluation.yml"

permissions:
  contents: read

jobs:
  retrieval-evaluation:
    name: Auth and retrieval tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check rich python-dotenv fastapi==0.115.0 "uvicorn[standard]==0.30.6" aiofiles==24.1.0

      - name: Import FastAPI application
        run: python -c "import asyncio, server; status = asyncio.run(server.get_status()); assert status['ready'] is False; print('FastAPI application import and initial status passed')"

      - name: Validate frontend JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("app.html").read_text(encoding="utf-8")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("Inline JavaScript block not found in app.html")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/app-inline.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/app-inline.js
      - name: Run authentication unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run core retrieval utility tests
        run: python tests.py

      - name: Run evaluator unit tests
        run: python -m unittest discover -s evaluation -p "test_*.py" -v

      - name: Run sample dataset smoke test
        run: python evaluation/retrieval_metrics.py evaluation/sample_dataset.jsonl --k 5
